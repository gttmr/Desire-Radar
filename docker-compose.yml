networks:
  agentic:
    driver: bridge

services:
  discord-bot:
    build:
      context: .
      dockerfile: packages/discord-bot/Dockerfile
    env_file:
      - .env
    environment:
      COLLECTOR_BASE_URL: http://collector:5002
      ORCHESTRATOR_BASE_URL: http://mcp-orchestrator:5003
    ports:
      - "3000:3000"
    depends_on:
      - collector
      - mcp-orchestrator
    volumes:
      - ./data/bot:/app/data
    networks:
      - agentic
    restart: unless-stopped

  collector:
    build:
      context: ./packages/collector
    env_file:
      - .env
    environment:
      LLM_CLI_EXEC_PATH: /usr/local/bin/codex
      OPENAI_BASE_URL: ""
    ports:
      - "5002:5002"
    volumes:
      - ./data/collector:/app/data
      - ./.env:/app/.env
      - ${HOME}/.claude:/home/collector/.claude:ro
      - ${HOME}/.codex:/home/collector/.codex:ro
      - ${HOME}/.gemini:/home/collector/.gemini
      - ${HOME}/.local/share/claude:/home/collector/.local/share/claude:ro
      - ${HOME}/.nvm/versions/node/v24.13.0/lib/node_modules/@openai/codex:/usr/local/lib/node_modules/@openai/codex:ro
      - ${HOME}/.nvm/versions/node/v24.13.0/lib/node_modules/@google/gemini-cli:/usr/local/lib/node_modules/@google/gemini-cli:ro
    networks:
      - agentic
    restart: unless-stopped

  mcp-orchestrator:
    build:
      context: .
      dockerfile: packages/mcp-orchestrator/Dockerfile
    env_file:
      - .env
    environment:
      COLLECTOR_BASE_URL: http://collector:5002
      OPENAI_BASE_URL: ""
      # CLI providers are the default path; OpenAI stays optional
      DEFAULT_PROVIDERS: ${DEFAULT_PROVIDERS:-codex,claude,gemini}
      # CLI paths inside the container
      CODEX_PATH: /usr/local/bin/codex
      CLAUDE_PATH: /usr/local/bin/claude
      GEMINI_PATH: /usr/local/bin/gemini
    ports:
      - "5003:5003"
    volumes:
      - ./data/orchestrator:/app/data
      # --- Host CLI auth directories (read-only) ---
      - ${HOME}/.claude:/home/node/.claude:ro
      # Codex needs a writable home dir for cache/session fallback paths.
      - ${HOME}/.codex:/home/node/.codex
      # Gemini also keeps local state/history/tmp under ~/.gemini.
      - ${HOME}/.gemini:/home/node/.gemini
      # --- Host CLI binaries ---
      # Claude: native binary
      - ${HOME}/.local/share/claude:/home/node/.local/share/claude:ro
      # Codex: npm global (needs node_modules)
      - ${HOME}/.nvm/versions/node/v24.13.0/lib/node_modules/@openai/codex:/usr/local/lib/node_modules/@openai/codex:ro
      # Gemini: npm global (needs node_modules)
      - ${HOME}/.nvm/versions/node/v24.13.0/lib/node_modules/@google/gemini-cli:/usr/local/lib/node_modules/@google/gemini-cli:ro
    networks:
      - agentic
    restart: unless-stopped
