version: '3.9'

networks:
  agentic:
    driver: bridge

services:
  discord-bot:
    build:
      context: .
      dockerfile: packages/discord-bot/Dockerfile
    env_file:
      - .env
    environment:
      PREDICTOR_BASE_URL: http://predictor-legacy:5001
      COLLECTOR_BASE_URL: http://collector:5002
      ORCHESTRATOR_BASE_URL: http://mcp-orchestrator:5003
    ports:
      - "3000:3000"
    depends_on:
      - predictor-legacy
      - collector
      - mcp-orchestrator
    volumes:
      - ./data/bot:/app/data
    networks:
      - agentic
    restart: unless-stopped

  predictor-legacy:
    build:
      context: ./packages/predictor-legacy
    env_file:
      - .env
    ports:
      - "5001:5001"
    volumes:
      - ./data/predictor:/app/data
    networks:
      - agentic
    restart: unless-stopped

  collector:
    build:
      context: ./packages/collector
    env_file:
      - .env
    ports:
      - "5002:5002"
    volumes:
      - ./data/collector:/app/data
    networks:
      - agentic
    restart: unless-stopped

  mcp-orchestrator:
    build:
      context: .
      dockerfile: packages/mcp-orchestrator/Dockerfile
    env_file:
      - .env
    environment:
      COLLECTOR_BASE_URL: http://collector:5002
      # OpenAI is the primary provider; CLI providers are optional fallbacks
      DEFAULT_PROVIDERS: ${DEFAULT_PROVIDERS:-openai}
      # CLI paths inside the container
      CODEX_PATH: /usr/local/bin/codex
      CLAUDE_PATH: /usr/local/bin/claude
      GEMINI_PATH: /usr/local/bin/gemini
    ports:
      - "5003:5003"
    volumes:
      - ./data/orchestrator:/app/data
      # --- Host CLI auth directories (read-only) ---
      - ${HOME}/.claude:/home/node/.claude:ro
      - ${HOME}/.codex:/home/node/.codex:ro
      - ${HOME}/.gemini:/home/node/.gemini:ro
      # --- Host CLI binaries ---
      # Claude: native binary
      - ${HOME}/.local/share/claude:/home/node/.local/share/claude:ro
      # Codex: npm global (needs node_modules)
      - ${HOME}/.nvm/versions/node/v24.13.0/lib/node_modules/@openai/codex:/usr/local/lib/node_modules/@openai/codex:ro
      # Gemini: npm global (needs node_modules)
      - ${HOME}/.nvm/versions/node/v24.13.0/lib/node_modules/@google/gemini-cli:/usr/local/lib/node_modules/@google/gemini-cli:ro
    networks:
      - agentic
    restart: unless-stopped
