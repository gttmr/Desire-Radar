version: '3.9'
services:
  bot-api:
    build: .
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - predictor
    volumes:
      - ./data:/app/data
    restart: unless-stopped
  predictor:
    build:
      context: ./predictor
    env_file:
      - .env
    ports:
      - "5001:5001"
    restart: unless-stopped
